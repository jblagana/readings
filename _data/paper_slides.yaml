# ---------------------------------------------------------------------------
# Paper deck: per-paper editorial content + citation snapshot.
#
# This is the "content" layer of the deck (papers.md). Bibliographic metadata
# (id, subtopic, year, title, venue, venue_type, doi, key_contribution, notes)
# lives in _data/papers.csv, which mirrors the audit artifact
# papers_scopus_table.csv at the repo root.
#
#   * Copy papers_scopus_table.csv -> _data/papers.csv when you update the table.
#   * Re-run `python3 tools/fetch_citations.py` to refresh `citations` and
#     `authors`. Provenance for the snapshot: tools/citations_snapshot.json.
#
# `citations` is OpenAlex `cited_by_count` - a point-in-time snapshot
# (meta.cited_asof), NOT a live count. Keep strings plain text (no markdown,
# no HTML): they are rendered as escaped text in the slides.
# ---------------------------------------------------------------------------

meta:
  cited_asof: "2026-09-08"
  citations_source: "OpenAlex (api.openalex.org, cited_by_count)"
  total: 41

slides:
  A01:
    citations: 37
    authors: "Chunhui Guo et al."
    hook: "Did GPUs actually speed up power flow in 2012 - and against which CPU baseline?"
    summary: "The first systematic GPU-versus-CPU head-to-head on parallel power-flow solvers. It establishes that the speedup is real and repeatable for the inner linear solve."
    interesting:
      - "Opened the GPU power-flow line this deck traces (A01-A16, 2012-2024)."
      - "Reports per-iteration time; the modern caveat is that total wall time - factorization plus data transfer - is the number that decides deployment."
      - "The inner solve is bandwidth-bound, not FLOP-bound, which is the reason this line kept winning."
    highlight: "The paper that started the GPU power-flow literature."
  A02:
    citations: 22
    authors: "Dino Ablakovic et al."
    hook: "Does the GPU win on distribution grids, not just big transmission cases?"
    summary: "Pushes GPU power flow to the distribution side: radial, three-phase - the networks utilities actually operate at the edge."
    interesting:
      - "One of the first distribution-level (not transmission) GPU power-flow studies."
      - "Radial three-phase topology is the standard distribution shape."
      - "Sets up the later distribution and DERMS OPF line (B05, B08 and the D subtopic)."
    highlight: "Distribution-scale, three-phase, radial - the real edge of the grid."
  A03:
    citations: 21
    authors: "Xue Li et al."
    hook: "Can you put a direct (multifrontal) factorization on the GPU for power flow?"
    summary: "Takes the direct (multifrontal) factorization route onto the GPU, posing the subtopic's central architectural question: iterative versus direct on a GPU."
    interesting:
      - "Frames the iterative-versus-direct debate that defines GPU power flow."
      - "Direct methods bring irregular sparsity and fill-in, which are hard to map to a GPU."
      - "The iterative side won by default; A03 is the direct-method reference point."
    highlight: "Poses the iterative-versus-direct question the whole subtopic answers."
  A04:
    citations: 48
    authors: "Xue Li et al."
    hook: "How do you make an iterative GPU power flow converge faster?"
    summary: "Iterative power flow on the GPU with a Chebyshev preconditioner driving conjugate gradients. This is where the preconditioner phase begins."
    interesting:
      - "Part of the 2014-2017 preconditioner phase of the subtopic."
      - "Preconditioning matters as much as the hardware; the contribution is the combination."
      - "Conjugate gradients need a good preconditioner to converge in a few iterations."
    highlight: "Begins the preconditioner era of GPU power flow."
  A05:
    citations: 11
    authors: "Xue Li et al."
    hook: "Can a two-step preconditioner beat the single-step version on the GPU?"
    summary: "Refines the conjugate-gradient approach with two-step preconditioning on the GPU, shaving more iterations off the convergence."
    interesting:
      - "Direct successor to A04 - same conjugate-gradient idea, a better preconditioner."
      - "Fewer iterations times per-iteration GPU speed is the compound win."
      - "A conference step in the iterative-preconditioning line."
    highlight: "Two-step preconditioning - the iterative method refined."
  A06:
    citations: 82
    authors: "Xue Li et al."
    hook: "What does GPU fast-decoupled power flow look like at flagship-journal quality?"
    summary: "The subtopic's flagship journal entry: fast-decoupled LF on the GPU with a preconditioned iterative solver and an inexact Newton method."
    interesting:
      - "The anchor journal paper for subtopic A (IEEE Transactions on Power Systems)."
      - "Combines FDLF plus preconditioning plus inexact Newton - the combination is the contribution."
      - "The most cited A-paper here (82), a useful reference for what a mature GPU power flow means."
    highlight: "The flagship journal result for GPU power flow."
  A07:
    citations: 29
    authors: "Morad Abdelaziz"
    hook: "Do you have to use CUDA to get the GPU win?"
    summary: "Monte-Carlo probabilistic power flow accelerated with OpenCL - the vendor-neutral route, showing CUDA is not the only door."
    interesting:
      - "Shows the non-CUDA route (OpenCL) is viable for probabilistic power flow."
      - "Monte-Carlo probabilistic power flow is embarrassingly parallel, a natural GPU fit."
      - "A counterpoint worth quoting: the method, not the vendor API, carries the speedup."
    highlight: "Proof you do not need CUDA - OpenCL does probabilistic power flow too."
  A08:
    citations: 12
    authors: "Shengjun Huang et al."
    hook: "On the GPU, is the direct solver finally competitive with iterative for fast-decoupled power flow?"
    summary: "A head-to-head performance analysis of a direct linear solver versus iterative methods for GPU fast-decoupled power flow."
    interesting:
      - "The direct-versus-iterative question, applied to fast-decoupled power flow specifically."
      - "A calibration paper (performance analysis), not a new method."
      - "Feeds the overall conclusion that iterative won by default."
    highlight: "Direct versus iterative for GPU fast-decoupled power flow, measured."
  A09:
    citations: 27
    authors: "Gan Zhou et al."
    hook: "Can you solve hundreds of power flows at once instead of one at a time?"
    summary: "Batched sparse LU on the GPU: many independent power flows in a single solve. This is the ancestor of the concurrency idea that now dominates OPF."
    interesting:
      - "The template for N-1 and scenario parallelism (echoed in B07 and the E gap)."
      - "GPU memory becomes the scenario warehouse: one card holds thousands of instances."
      - "The batch-of-independent-solves pattern is the core GPU insight this whole package builds on."
    highlight: "The batched-LU ancestor of N-1 and scenario parallelism."
  A10:
    citations: 24
    authors: "Igor Araújo et al."
    hook: "What is the cleanest hybrid CPU-plus-GPU way to run many power flows?"
    summary: "A hybrid CPU-GPU approach for running simultaneous parallel power-flow calculations, balancing the work split across the two devices."
    interesting:
      - "Part of the 2018-present consolidation phase of the subtopic."
      - "Hybrid CPU-GPU partitioning - a design question that recurs in OPF and UC."
      - "Which part runs on the card and which on the CPU is a systems contribution, not just a kernel one."
    highlight: "Hybrid CPU plus GPU batched power flow."
  A11:
    citations: 39
    authors: "Xueneng Su et al."
    hook: "Can you parallelize the entire Newton power flow, not just the inner solve?"
    summary: "A full Newton power flow parallelized across GPU and CPU with vectorization and sparse techniques - the whole pipeline, not just one step."
    interesting:
      - "Full-Newton (not just the linear solve) parallelization, in IEEE Transactions on Smart Grid."
      - "Uses vectorization and sparsity to keep the GPU fed."
      - "Represents the full-pipeline-on-GPU end of the subtopic."
    highlight: "The full Newton pipeline, parallelized GPU plus CPU."
  A12:
    citations: 25
    authors: "Dong-Hee Yoon et al."
