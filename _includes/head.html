<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% seo %}

  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css?v=2' | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
  <meta name="theme-color" content="#0d1526">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link type="application/atom+xml" rel="alternate" href="{{ '/feed.xml' | relative_url }}" title="{{ site.title }}">
  {% unless page.no_tooltips %}
  <script>window.READINGS_GLOSSARY = {{ site.data.glossary | jsonify | replace: '</', '<\/' }};</script>
  <script src="{{ '/assets/js/glossary_tooltips.js?v=7' | relative_url }}" defer></script>
  {% endunless %}

  <!-- KaTeX (pinned CDN build): renders the $...$ / $$...$$ equations and
       powers of ten used in the .md sources. renderReadingsMath() is the
       shared entry point — it also runs over the tooltip bodies and over
       client-side-injected content from assets/js/glossary_tooltips.js.
       Fails soft: if the CDN is unreachable the raw $...$ text stays
       readable and nothing else on the page is affected. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.7/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.7/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.7/dist/contrib/auto-render.min.js"></script>
  <script>
    window.READINGS_MATH = {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$', right: '$', display: false }
      ],
      ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code',
                    'option', 'select', 'button', 'kbd', 'samp']
    };
    window.renderReadingsMath = function (el) {
      if (el && typeof window.renderMathInElement === 'function') {
        window.renderMathInElement(el, window.READINGS_MATH);
      }
    };
    document.addEventListener('DOMContentLoaded', function () {
      window.renderReadingsMath(document.body);
    });
  </script>
</head>
