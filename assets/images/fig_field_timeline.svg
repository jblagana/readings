<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d">
  <title id="t">Subtopic A timeline: 16 papers, 2012 to 2024</title>
  <desc id="d">A horizontal 2012 to 2024 axis in three phases: existence (2012 to 2014), preconditioners (2014 to 2017), consolidation (2018 to 2024). Dots mark papers A01 through A16, with A06, A09, A11 and A12 highlighted. A callout from A09 (TPWRS 2017, batched LU on one GPU) notes it is the ancestor of scenario and contingency concurrency.</desc>
  <style>
    text { font-family: Inter, "Segoe UI", system-ui, sans-serif; }
    .h { font-size: 15px; font-weight: 700; fill: #0d1526; }
    .sub { font-size: 11.5px; fill: #46536b; }
    .band { font-size: 11px; font-weight: 700; fill: #0d1526; }
    .bandsub { font-size: 9.5px; fill: #7d8798; }
    .yr { font-size: 10.5px; fill: #7d8798; }
    .dot { font-size: 9px; font-weight: 600; fill: #46536b; }
    .call { font-size: 10.5px; font-weight: 600; fill: #0d1526; }
    .callsub { font-size: 10.5px; fill: #7d8798; }
    .foot { font-size: 11px; fill: #46536b; }
  </style>

  <text class="h" x="40" y="28">Subtopic A in one line: 16 papers, 2012–2024</text>
  <text class="sub" x="40" y="46">three phases — the batched-LU idea (A09) is where the contingency / scenario line begins</text>

  <!-- phase bands -->
  <rect x="107" y="118" width="94" height="82" fill="#eef2f7"/>
  <rect x="201" y="118" width="142" height="82" fill="#fff7e6"/>
  <rect x="390" y="118" width="283" height="82" fill="#ecfdf5"/>
  <text class="band" x="154" y="138" text-anchor="middle">existence</text>
  <text class="bandsub" x="154" y="152" text-anchor="middle">does it even work</text>
  <text class="band" x="272" y="138" text-anchor="middle">preconditioners</text>
  <text class="bandsub" x="272" y="152" text-anchor="middle">CG, FDLF, inexact Newton</text>
  <text class="band" x="531" y="138" text-anchor="middle">consolidation</text>
  <text class="bandsub" x="531" y="152" text-anchor="middle">hybrid batched, reviews, conference stream</text>

  <!-- axis -->
  <line x1="52" y1="210" x2="728" y2="210" stroke="#46536b" stroke-width="1.5"/>
  <polygon points="722,205 722,215 732,210" fill="#46536b"/>
  <g stroke="#46536b" stroke-width="1.5">
    <line x1="107" y1="210" x2="107" y2="217"/><line x1="201" y1="210" x2="201" y2="217"/><line x1="296" y1="210" x2="296" y2="217"/><line x1="390" y1="210" x2="390" y2="217"/><line x1="484" y1="210" x2="484" y2="217"/><line x1="579" y1="210" x2="579" y2="217"/><line x1="673" y1="210" x2="673" y2="217"/>
  </g>
  <g class="yr" text-anchor="middle">
    <text x="107" y="230">2012</text><text x="201" y="230">2014</text><text x="296" y="230">2016</text><text x="390" y="230">2018</text><text x="484" y="230">2020</text><text x="579" y="230">2022</text><text x="673" y="230">2024</text>
  </g>

  <!-- dots -->
  <g fill="#0d1526">
    <circle cx="107" cy="166" r="4.5"/><circle cx="107" cy="182" r="4.5"/>
    <circle cx="154" cy="166" r="4.5"/><circle cx="201" cy="166" r="4.5"/><circle cx="249" cy="166" r="4.5"/>
