    <circle cx="343" cy="196" r="6.5"/>
    <circle cx="437" cy="166" r="6.5"/>
    <circle cx="484" cy="166" r="6.5"/>
  </g>
  <g class="dot" text-anchor="middle">
    <text x="107" y="158">A01</text>
    <text x="154" y="158">A03</text><text x="201" y="158">A04</text><text x="249" y="158">A05</text>
    <text x="296" y="158">A06</text>
    <text x="343" y="158">A07</text>
