  <line x1="343" y1="196" x2="343" y2="252" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text class="call" x="353" y="252">A09 (TPWRS 2017) — batched LU on one GPU:</text>
  <text class="callsub" x="353" y="266">the ancestor of scenario / contingency concurrency</text>

  <text class="foot" x="60" y="300">Full list, venues and DOIs: papers_scopus_table.csv (rows A01–A16) — every row verified on Scopus in 05.</text>
