<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="t d">
  <title id="t">The DERMS timescale ladder</title>
  <desc id="d">Four descending steps from strategic planning over years, to daily 24-hour ahead planning, to intraday re-dispatch at one to 60 minute cadence, to a navy real-time step at sub-second to one second cadence marked as the GPU-batching target. A horizontal arrow runs underneath from slow to fast.</desc>
  <style>
    text { font-family: Inter, "Segoe UI", system-ui, sans-serif; }
    .h { font-size: 15px; font-weight: 700; fill: #0d1526; }
    .sub { font-size: 11.5px; fill: #46536b; }
    .step { font-size: 12.5px; font-weight: 700; fill: #0d1526; }
    .tc { font-size: 11px; font-weight: 700; fill: #b45309; }
    .sd { font-size: 10.5px; fill: #46536b; }
    .xs { font-size: 10.5px; fill: #7d8798; }
    .stepw { font-size: 12.5px; font-weight: 700; fill: #ffffff; }
    .tca { font-size: 11px; font-weight: 700; fill: #f59e0b; }
    .sdw { font-size: 10.5px; fill: #e8edf6; }
    .pill { font-size: 9.5px; font-weight: 600; fill: #92400e; }
  </style>

  <text class="h" x="40" y="28">The DERMS timescale ladder</text>
  <text class="sub" x="40" y="46">one system, four decision speeds — the bottom rung is where GPU batching has to land</text>

  <!-- descent connector (behind boxes) -->
  <path d="M40,60 L220,112 L400,164 L580,216" fill="none" stroke="#e4e8ee" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- GPU target pill -->
  <rect x="580" y="198" width="160" height="18" rx="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text class="pill" x="660" y="210.5" text-anchor="middle">GPU-batching target (03, Subtopic D)</text>

  <!-- steps -->
  <rect x="40" y="60" width="160" height="80" rx="10" fill="#f8fafc" stroke="#0d1526" stroke-width="1.5"/>
  <text class="step" x="54" y="80">Strategic / planning</text>
  <text class="tc" x="54" y="97">years</text>
  <text class="sd" x="54" y="116">which DERs to build, sizing</text>
  <text class="xs" x="54" y="131">investment LP / MILP</text>

  <rect x="220" y="112" width="160" height="80" rx="10" fill="#f8fafc" stroke="#0d1526" stroke-width="1.5"/>
  <text class="step" x="234" y="132">Daily</text>
  <text class="tc" x="234" y="149">24 h ahead</text>
  <text class="sd" x="234" y="168">storage plan, DR programs</text>
  <text class="xs" x="234" y="183">MILP / stochastic</text>

  <rect x="400" y="164" width="160" height="80" rx="10" fill="#f8fafc" stroke="#0d1526" stroke-width="1.5"/>
  <text class="step" x="414" y="184">Intraday</text>
  <text class="tc" x="414" y="201">1–60 min</text>
  <text class="sd" x="414" y="220">re-dispatch, re-planning</text>
  <text class="xs" x="414" y="235">OPF / MPC</text>

  <rect x="580" y="216" width="160" height="80" rx="10" fill="#0d1526"/>
  <text class="stepw" x="594" y="236">Real-time</text>
  <text class="tca" x="594" y="253">sub-second – 1 s</text>
  <text class="sdw" x="594" y="270">inverter setpoints, voltage</text>
  <text class="sdw" x="594" y="284">support · fast OPF · ADMM</text>

  <!-- slow-to-fast arrow -->
  <line x1="40" y1="318" x2="700" y2="318" stroke="#46536b" stroke-width="1.5"/>
  <polygon points="700,312.5 712,318 700,323.5" fill="#46536b"/>
  <text class="xs" x="40" y="308">slow — what to build</text>
  <text class="xs" x="700" y="308" text-anchor="end">fast — hold the voltage</text>
</svg>
