<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="t d">
  <title id="t">The three GPU regimes</title>
  <desc id="d">Three panels. Panel 1, launch-overhead: per-iteration time bars show the GPU slower than the CPU below about 1k buses. Panel 2, bandwidth-bound: a time-versus-rows chart where the GPU curve rises steeply then flattens at the HBM ceiling while the CPU keeps climbing, a 30 to 190 fold gap. Panel 3, memory-capacity: a 40 GB HBM card holding a grid of many small problem instances, the batch is the speedup.</desc>
  <style>
    text { font-family: Inter, "Segoe UI", system-ui, sans-serif; }
    .h { font-size: 15px; font-weight: 700; fill: #0d1526; }
    .sub { font-size: 11.5px; fill: #46536b; }
    .ph { font-size: 13.5px; font-weight: 700; fill: #0d1526; }
    .xs { font-size: 10.5px; fill: #7d8798; }
    .xsa { font-size: 10.5px; fill: #b45309; font-weight: 600; }
    .xsnavy { font-size: 10.5px; fill: #0d1526; font-weight: 600; }
    .gap { font-size: 13px; font-weight: 700; fill: #b45309; }
    .v { font-size: 11px; fill: #92400e; }
    .boxt { font-size: 11px; font-weight: 700; fill: #0d1526; }
    .foot { font-size: 12px; fill: #46536b; }
  </style>

  <text class="h" x="40" y="28">Where GPUs actually help — the three regimes</text>
  <text class="sub" x="40" y="46">From your own measurements (02 §5.4), generalized</text>

  <!-- panel 1: launch-overhead -->
  <rect x="16" y="64" width="232" height="300" rx="10" fill="#f8fafc" stroke="#0d1526" stroke-width="1.5"/>
  <text class="ph" x="32" y="92">1 · Launch-overhead</text>
  <text class="sub" x="32" y="110">below ~1k buses, small nnz</text>
  <text class="xs" x="32" y="138">5-bus sweep, per iteration (kernel 03)</text>
  <rect x="32" y="148" width="36" height="16" rx="3" fill="#10b981"/>
  <text class="xs" x="76" y="160">CPU ~0.05 ms</text>
  <rect x="32" y="176" width="184" height="16" rx="3" fill="#0d1526"/>
  <text class="xs" x="32" y="210">GPU 0.17–0.4 ms — mostly</text>
  <text class="xs" x="32" y="224">memcpy + sync, not compute</text>
  <rect x="32" y="240" width="200" height="104" rx="8" fill="#fef3c7"/>
  <text class="v" x="44" y="262">GPU does nothing useful here.</text>
  <text class="v" x="44" y="278">One 5-bus solve is cheaper on</text>
  <text class="v" x="44" y="292">the CPU.</text>
  <text class="v" x="44" y="308">Solve small — or batch the cases</text>
  <text class="v" x="44" y="322">until the batch pays (panel 3).</text>

  <!-- panel 2: bandwidth-bound -->
  <rect x="262" y="64" width="232" height="300" rx="10" fill="#f8fafc" stroke="#0d1526" stroke-width="1.5"/>
  <text class="ph" x="278" y="92">2 · Bandwidth-bound</text>
  <text class="sub" x="278" y="108">≈10⁴–10⁶ rows, SpMV-shaped</text>
  <text class="sub" x="278" y="122">inner solve</text>
  <line x1="290" y1="146" x2="290" y2="282" stroke="#46536b" stroke-width="1.5"/>
  <line x1="290" y1="282" x2="466" y2="282" stroke="#46536b" stroke-width="1.5"/>
  <path d="M290,282 C330,252 380,200 466,176" fill="none" stroke="#0d1526" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="360" y1="176" x2="466" y2="176" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text class="xsa" x="466" y="168" text-anchor="end">HBM ceiling ~1.4 TB/s</text>
  <path d="M290,282 L428,142" fill="none" stroke="#7d8798" stroke-width="2" stroke-dasharray="6,4"/>
  <text class="xs" x="420" y="134" text-anchor="end">CPU ~20 GB/s</text>
  <text class="xsnavy" x="378" y="192">GPU ~1.4 TB/s</text>
  <text class="gap" x="452" y="212" text-anchor="end">30–190×</text>
  <text class="xs" x="466" y="298" text-anchor="end">rows per sweep →</text>
  <text class="xs" x="276" y="214" text-anchor="middle" transform="rotate(-90 276 214)">time / sweep</text>
  <rect x="278" y="312" width="200" height="36" rx="8" fill="#fef3c7"/>
  <text class="v" x="290" y="326">The inner solve wins 30–190×</text>
  <text class="v" x="290" y="340">(kernels 01, 02).</text>

  <!-- panel 3: memory-capacity -->
  <rect x="508" y="64" width="232" height="300" rx="10" fill="#f8fafc" stroke="#0d1526" stroke-width="1.5"/>
  <text class="ph" x="524" y="92">3 · Memory-capacity</text>
  <text class="sub" x="524" y="108">thousands of independent instances</text>
  <text class="sub" x="524" y="122">(N-1, scenarios, feeders)</text>
  <rect x="524" y="136" width="200" height="118" rx="8" fill="#ffffff" stroke="#0d1526" stroke-width="1.5"/>
  <text class="boxt" x="536" y="154">one A100 — 40 GB HBM</text>
  <g fill="#0d1526">
    <rect x="536" y="164" width="18" height="13" rx="2.5"/><rect x="557" y="164" width="18" height="13" rx="2.5"/><rect x="578" y="164" width="18" height="13" rx="2.5"/><rect x="599" y="164" width="18" height="13" rx="2.5"/><rect x="620" y="164" width="18" height="13" rx="2.5"/><rect x="641" y="164" width="18" height="13" rx="2.5"/><rect x="662" y="164" width="18" height="13" rx="2.5"/><rect x="683" y="164" width="18" height="13" rx="2.5"/>
    <rect x="536" y="180" width="18" height="13" rx="2.5"/><rect x="578" y="180" width="18" height="13" rx="2.5"/><rect x="599" y="180" width="18" height="13" rx="2.5"/><rect x="620" y="180" width="18" height="13" rx="2.5"/><rect x="641" y="180" width="18" height="13" rx="2.5"/><rect x="662" y="180" width="18" height="13" rx="2.5"/><rect x="683" y="180" width="18" height="13" rx="2.5"/>
    <rect x="536" y="196" width="18" height="13" rx="2.5"/><rect x="557" y="196" width="18" height="13" rx="2.5"/><rect x="578" y="196" width="18" height="13" rx="2.5"/><rect x="599" y="196" width="18" height="13" rx="2.5"/><rect x="620" y="196" width="18" height="13" rx="2.5"/><rect x="641" y="196" width="18" height="13" rx="2.5"/><rect x="662" y="196" width="18" height="13" rx="2.5"/><rect x="683" y="196" width="18" height="13" rx="2.5"/>
    <rect x="536" y="212" width="18" height="13" rx="2.5"/><rect x="557" y="212" width="18" height="13" rx="2.5"/><rect x="578" y="212" width="18" height="13" rx="2.5"/><rect x="599" y="212" width="18" height="13" rx="2.5"/><rect x="620" y="212" width="18" height="13" rx="2.5"/><rect x="641" y="212" width="18" height="13" rx="2.5"/><rect x="662" y="212" width="18" height="13" rx="2.5"/><rect x="683" y="212" width="18" height="13" rx="2.5"/>
  </g>
  <rect x="557" y="180" width="18" height="13" rx="2.5" fill="#f59e0b"/>
  <text class="xs" x="712" y="244" text-anchor="end">… and thousands more fit</text>
  <text class="xs" x="524" y="266">the batch is the speedup: one card</text>
  <text class="xs" x="524" y="280">holds the cases a CPU would stream</text>
  <rect x="524" y="292" width="200" height="52" rx="8" fill="#fef3c7"/>
  <text class="v" x="536" y="308">A09 (batched LU) and B07 already</text>
  <text class="v" x="536" y="322">run this way — the DERMS batch</text>
  <text class="v" x="536" y="336">argument rests on it.</text>

  <text class="foot" x="380" y="392" text-anchor="middle">The regimes are not alternatives: a real-time DERMS solver runs all three at once —</text>
  <text class="foot" x="380" y="410" text-anchor="middle">small per-feeder solves (A), SpMV-shaped inner loops (B), N feeders × M steps × K scenarios (C).</text>
</svg>
