<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="t d">
  <title id="t">CPU versus GPU</title>
  <desc id="d">A CPU with four large cores and caches on the left, a GPU with a grid of many small cores and an HBM memory bar on the right.</desc>
  <style>
    text { font-family: Inter, "Segoe UI", system-ui, sans-serif; }
    .h { font-size: 15px; font-weight: 700; fill: #0d1526; }
    .sub { font-size: 11.5px; fill: #46536b; }
    .lab { font-size: 12px; fill: #46536b; }
    .core { font-size: 12px; font-weight: 600; fill: #46536b; }
    .hbm { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .foot { font-size: 12px; fill: #46536b; }
  </style>

  <!-- CPU chip -->
  <rect x="40" y="40" width="290" height="200" rx="14" fill="#f8fafc" stroke="#0d1526" stroke-width="2"/>
  <text class="h" x="60" y="72">CPU</text>
  <text class="sub" x="60" y="90">latency machine</text>
  <!-- cores, row 1 -->
  <rect x="60" y="104" width="92" height="44" rx="6" fill="#ffffff" stroke="#0d1526" stroke-width="1.5"/>
  <text class="core" x="106" y="131" text-anchor="middle">core</text>
  <rect x="60" y="151" width="92" height="7" rx="3.5" fill="#f59e0b"/>
  <rect x="166" y="104" width="92" height="44" rx="6" fill="#ffffff" stroke="#0d1526" stroke-width="1.5"/>
  <text class="core" x="212" y="131" text-anchor="middle">core</text>
  <rect x="166" y="151" width="92" height="7" rx="3.5" fill="#f59e0b"/>
  <!-- cores, row 2 -->
  <rect x="60" y="170" width="92" height="44" rx="6" fill="#ffffff" stroke="#0d1526" stroke-width="1.5"/>
  <text class="core" x="106" y="197" text-anchor="middle">core</text>
  <rect x="60" y="217" width="92" height="7" rx="3.5" fill="#f59e0b"/>
  <rect x="166" y="170" width="92" height="44" rx="6" fill="#ffffff" stroke="#0d1526" stroke-width="1.5"/>
  <text class="core" x="212" y="197" text-anchor="middle">core</text>
  <rect x="166" y="217" width="92" height="7" rx="3.5" fill="#f59e0b"/>
  <text class="lab" x="60" y="252">4–16 strong cores, deep pipelines,</text>
  <text class="lab" x="60" y="268">big caches, branch prediction</text>

  <!-- vs -->
  <circle cx="375" cy="140" r="22" fill="#f59e0b"/>
  <text x="375" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#0d1526">vs</text>

  <!-- GPU chip -->
  <rect x="430" y="40" width="290" height="200" rx="14" fill="#f8fafc" stroke="#0d1526" stroke-width="2"/>
  <text class="h" x="450" y="72">GPU</text>
  <text class="sub" x="450" y="90">throughput machine</text>
  <!-- small core grid: 11 x 3 -->
  <g fill="#0d1526">
    <rect x="450" y="106" width="20" height="14" rx="3"/><rect x="474" y="106" width="20" height="14" rx="3"/><rect x="498" y="106" width="20" height="14" rx="3"/><rect x="522" y="106" width="20" height="14" rx="3"/><rect x="546" y="106" width="20" height="14" rx="3"/><rect x="570" y="106" width="20" height="14" rx="3"/><rect x="594" y="106" width="20" height="14" rx="3"/><rect x="618" y="106" width="20" height="14" rx="3"/><rect x="642" y="106" width="20" height="14" rx="3"/><rect x="666" y="106" width="20" height="14" rx="3"/><rect x="690" y="106" width="20" height="14" rx="3"/>
    <rect x="450" y="124" width="20" height="14" rx="3"/><rect x="474" y="124" width="20" height="14" rx="3"/><rect x="498" y="124" width="20" height="14" rx="3"/><rect x="522" y="124" width="20" height="14" rx="3"/><rect x="546" y="124" width="20" height="14" rx="3"/><rect x="570" y="124" width="20" height="14" rx="3"/><rect x="594" y="124" width="20" height="14" rx="3"/><rect x="618" y="124" width="20" height="14" rx="3"/><rect x="642" y="124" width="20" height="14" rx="3"/><rect x="666" y="124" width="20" height="14" rx="3"/><rect x="690" y="124" width="20" height="14" rx="3"/>
    <rect x="450" y="142" width="20" height="14" rx="3"/><rect x="474" y="142" width="20" height="14" rx="3"/><rect x="498" y="142" width="20" height="14" rx="3"/><rect x="522" y="142" width="20" height="14" rx="3"/><rect x="546" y="142" width="20" height="14" rx="3"/><rect x="570" y="142" width="20" height="14" rx="3"/><rect x="594" y="142" width="20" height="14" rx="3"/><rect x="618" y="142" width="20" height="14" rx="3"/><rect x="642" y="142" width="20" height="14" rx="3"/><rect x="666" y="142" width="20" height="14" rx="3"/><rect x="690" y="142" width="20" height="14" rx="3"/>
  </g>
  <text class="lab" x="450" y="176">thousands of small cores —</text>
  <text class="lab" x="450" y="192">warps of 32 threads</text>
  <!-- HBM bar -->
  <rect x="450" y="204" width="260" height="26" rx="5" fill="#0d1526"/>
  <g stroke="#f59e0b" stroke-width="1.5">
    <line x1="515" y1="204" x2="515" y2="230"/>
    <line x1="580" y1="204" x2="580" y2="230"/>
    <line x1="645" y1="204" x2="645" y2="230"/>
  </g>
  <text class="hbm" x="580" y="222" text-anchor="middle">HBM — ~2 TB/s</text>

  <text class="foot" x="380" y="300" text-anchor="middle">Same silicon, two strategies: a few deep pipelines, or a swarm of thin threads switched in ~1 cycle</text>
</svg>
